<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지점 대시보드 · 로그인</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-stamp" id="stampToday">--<br>--</div>
    <div class="auth-brand">
      <div class="mark">지</div>
      <h1>지점 대시보드</h1>
    </div>
    <p class="auth-sub">공지 · 일정 · 직원정보 · 실적을 한 곳에서</p>

    <div class="auth-toggle">
      <button id="tabLogin" class="active">로그인</button>
      <button id="tabSignup">회원가입</button>
    </div>

    <div class="auth-error" id="authError"></div>

    <!-- 로그인 폼 -->
    <form id="loginForm">
      <div class="field">
        <label for="loginEmail">이메일</label>
        <input type="email" id="loginEmail" placeholder="name@company.com" required>
      </div>
      <div class="field">
        <label for="loginPw">비밀번호</label>
        <input type="password" id="loginPw" placeholder="비밀번호" required>
      </div>
      <button type="submit" class="btn-primary auth-submit">로그인</button>
    </form>

    <!-- 회원가입 폼 -->
    <form id="signupForm" class="hide">
      <div class="field">
        <label for="suName">이름</label>
        <input type="text" id="suName" placeholder="홍길동" required>
      </div>
      <div class="field">
        <label for="suPosition">직책</label>
        <input type="text" id="suPosition" placeholder="예: 매니저, 스태프" required>
      </div>
      <div class="field">
        <label for="suEmail">이메일</label>
        <input type="email" id="suEmail" placeholder="name@company.com" required>
      </div>
      <div class="field">
        <label for="suPw">비밀번호</label>
        <input type="password" id="suPw" placeholder="6자 이상" required minlength="6">
      </div>
      <button type="submit" class="btn-primary auth-submit">계정 만들기</button>
    </form>

    <p class="auth-hint">가입 후 관리자가 승인해야 정상 접근할 수 있어요.<br>가입 즉시 Firebase 콘솔에서 첫 관리자 계정을 지정해주세요.</p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
