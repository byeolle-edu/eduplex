<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지점 대시보드</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="mark">지</div>
      <span>지점 대시보드</span>
    </div>
    <div class="nav-item active" data-view="announcements"><i>📌</i> 공지사항</div>
    <div class="nav-item" data-view="schedule"><i>🗓</i> 일정 관리</div>
    <div class="nav-item" data-view="staff"><i>👥</i> 직원 정보</div>
    <div class="nav-item" data-view="sales"><i>📊</i> 실적 현황</div>
    <div class="sidebar-foot">
      <div class="sidebar-user">
        <b id="curName">불러오는 중...</b>
        <span id="curPosition"></span>
      </div>
      <button class="btn-ghost btn-sm" id="logoutBtn" style="width:100%;color:#DCE4E2;border-color:rgba(220,228,226,.3);">로그아웃</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h2 id="viewTitle">공지사항</h2>
        <p id="viewSub">지점 전체에 전달할 소식을 확인하세요</p>
      </div>
      <div class="stamp-today" id="stampToday">--<br>--</div>
    </div>

    <!-- 공지사항 -->
    <section id="view-announcements" class="view">
      <div class="panel" id="announceFormPanel">
        <div class="panel-head"><h3>새 공지 작성</h3></div>
        <form class="inline-form" id="announceForm">
          <div class="full field">
            <label>제목</label>
            <input type="text" id="annTitle" placeholder="예: 8월 정기 청소 안내" required>
          </div>
          <div class="full field">
            <label>내용</label>
            <textarea id="annBody" rows="3" placeholder="공지 내용을 입력하세요" required></textarea>
          </div>
          <div class="actions">
            <button type="submit" class="btn-primary btn-sm">등록</button>
          </div>
        </form>
      </div>
      <div class="panel">
        <div class="panel-head"><h3>공지 목록</h3></div>
        <div id="announceList"><div class="empty-state">불러오는 중...</div></div>
      </div>
    </section>

    <!-- 일정 관리 -->
    <section id="view-schedule" class="view hide">
      <div class="panel">
        <div class="panel-head"><h3>새 일정 등록</h3></div>
        <form class="inline-form" id="scheduleForm">
          <div class="field">
            <label>날짜</label>
            <input type="date" id="schDate" required>
          </div>
          <div class="field">
            <label>제목</label>
            <input type="text" id="schTitle" placeholder="예: 원장님 미팅" required>
          </div>
          <div class="full field">
            <label>메모</label>
            <textarea id="schMemo" rows="2" placeholder="상세 내용 (선택)"></textarea>
          </div>
          <div class="actions">
            <button type="submit" class="btn-primary btn-sm">등록</button>
          </div>
        </form>
      </div>
      <div class="panel">
        <div class="panel-head"><h3>일정 목록</h3></div>
        <div id="scheduleList"><div class="empty-state">불러오는 중...</div></div>
      </div>
    </section>

    <!-- 직원 정보 -->
    <section id="view-staff" class="view hide">
      <div class="panel">
        <div class="panel-head"><h3>내 정보 수정</h3></div>
        <form class="inline-form" id="profileForm">
          <div class="field">
            <label>직책</label>
            <input type="text" id="myPosition" placeholder="예: 매니저">
          </div>
          <div class="field">
            <label>연락처</label>
            <input type="text" id="myPhone" placeholder="010-0000-0000">
          </div>
          <div class="actions">
            <button type="submit" class="btn-primary btn-sm">저장</button>
          </div>
        </form>
      </div>
      <div class="panel">
        <div class="panel-head"><h3>전 직원 목록</h3></div>
        <div id="staffList"><div class="empty-state">불러오는 중...</div></div>
      </div>
    </section>

    <!-- 실적 현황 -->
    <section id="view-sales" class="view hide">
      <div class="metric-grid" id="salesMetrics"></div>
      <div class="panel">
        <div class="panel-head"><h3>실적 등록</h3></div>
        <form class="inline-form" id="salesForm">
          <div class="field">
            <label>날짜</label>
            <input type="date" id="saleDate" required>
          </div>
          <div class="field">
            <label>매출액 (원)</label>
            <input type="number" id="saleAmount" placeholder="예: 1500000" required>
          </div>
          <div class="full field">
            <label>메모</label>
            <input type="text" id="saleMemo" placeholder="예: 프로모션 매출 포함 (선택)">
          </div>
          <div class="actions">
            <button type="submit" class="btn-primary btn-sm">등록</button>
          </div>
        </form>
      </div>
      <div class="panel">
        <div class="panel-head"><h3>이번 달 실적 내역</h3></div>
        <div id="salesList"><div class="empty-state">불러오는 중...</div></div>
      </div>
    </section>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/app.js"></script>
</body>
</html>
