<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교재 큐레이션 — 자기주도학습 학원</title>
<style>
  :root {
    --bg: #f7f6f3; --surface: #ffffff; --surface2: #f0efe9;
    --border: #e2e0d8; --border-strong: #c8c5bb;
    --text-primary: #1a1916; --text-secondary: #5a5850; --text-muted: #9a9688;
    --accent: #2d6a4f; --accent-light: #e8f4ed; --accent-border: #b7dcc8; --accent-text: #1a4a34;
    --warn: #7a4f1a; --warn-light: #fdf3e3; --warn-border: #e8c98a;
    --danger: #7a1a1a; --danger-light: #fdf0f0; --danger-border: #e8b0b0;
    --radius: 8px; --radius-lg: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Apple SD Gothic Neo','Noto Sans KR',sans-serif; background: var(--bg); color: var(--text-primary); font-size: 15px; line-height: 1.6; min-height: 100vh; }
  .layout { display: flex; min-height: 100vh; }

  .sidebar { width: 220px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); padding: 28px 0; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .sidebar-logo { font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: .06em; padding: 0 20px 18px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
  .nav-section { padding: 0 10px; margin-bottom: 4px; }
  .nav-label { font-size: 10px; color: var(--text-muted); letter-spacing: .08em; text-transform: uppercase; padding: 4px 8px 8px; display: block; }
  .grade-btn { display: block; width: 100%; padding: 8px 10px; text-align: left; border: none; background: none; border-radius: var(--radius); font-size: 13px; color: var(--text-secondary); cursor: pointer; margin-bottom: 1px; font-family: inherit; }
  .grade-btn:hover { background: var(--surface2); }
  .grade-btn.active { background: var(--accent-light); color: var(--accent-text); font-weight: 600; }

  .main { flex: 1; padding: 32px 36px; max-width: 920px; }

  .filter-bar { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; align-items: center; }
  .filter-group { display: flex; align-items: center; gap: 7px; }
  .filter-label { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
  .chip { padding: 5px 13px; border-radius: 20px; border: 1px solid var(--border-strong); font-size: 12px; background: var(--surface); color: var(--text-secondary); cursor: pointer; font-family: inherit; transition: all .1s; }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.sel-high { background: var(--accent-light); border-color: var(--accent-border); color: var(--accent-text); font-weight: 600; }
  .chip.sel-mid  { background: var(--warn-light);   border-color: var(--warn-border);   color: var(--warn);        font-weight: 600; }
  .chip.sel-low  { background: var(--danger-light); border-color: var(--danger-border); color: var(--danger);      font-weight: 600; }
  .chip.sel-season { background: var(--accent-light); border-color: var(--accent-border); color: var(--accent-text); font-weight: 600; }
  .divider-v { width: 1px; height: 18px; background: var(--border); }

  .subj-area { margin-bottom: 22px; }
  .subj-group { margin-bottom: 12px; }
  .subj-group-label { font-size: 11px; color: var(--text-muted); margin-bottom: 7px; padding-left: 2px; }
  .subj-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .subj-tab { padding: 5px 13px; border-radius: 20px; border: 1px solid var(--border); font-size: 12px; background: var(--surface); color: var(--text-secondary); cursor: pointer; font-family: inherit; transition: all .1s; white-space: nowrap; }
  .subj-tab:hover { border-color: var(--border-strong); color: var(--text-primary); }
  .subj-tab.active { background: var(--text-primary); border-color: var(--text-primary); color: #fff; font-weight: 600; }

  .result-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
  .result-title { font-size: 18px; font-weight: 700; }
  .result-title span { color: var(--accent); }
  .result-count { font-size: 13px; color: var(--text-muted); }

  .book-list { display: flex; flex-direction: column; gap: 14px; }
  .book-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 22px 24px; transition: border-color .12s, box-shadow .12s; }
  .book-card:hover { border-color: var(--border-strong); box-shadow: 0 2px 12px rgba(0,0,0,.05); }

  .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
  .card-name { font-size: 15px; font-weight: 700; color: var(--text-primary); }
  .card-pub { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
  .card-header-right { display: flex; gap: 5px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
  .badge { font-size: 11px; padding: 3px 9px; border-radius: 8px; font-weight: 600; white-space: nowrap; }
  .badge-summer { background: #e8f4ed; color: #1a4a34; border: 1px solid #b7dcc8; }
  .badge-winter { background: #eef2ff; color: #1a2a7a; border: 1px solid #b0bcf0; }
  .badge-always { background: #f5f5f0; color: #3a3a30; border: 1px solid #d0cfca; }
  .badge-level-high { background: var(--accent-light); color: var(--accent-text); border: 1px solid var(--accent-border); }
  .badge-level-mid  { background: var(--warn-light);   color: var(--warn);        border: 1px solid var(--warn-border); }
  .badge-level-low  { background: var(--danger-light); color: var(--danger);      border: 1px solid var(--danger-border); }
  .badge-level-all  { background: #f5f5f0; color: #3a3a30; border: 1px solid #d0cfca; }

  .meta-row { display: flex; gap: 0; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 14px; }
  .meta-cell { flex: 1; padding: 10px 14px; border-right: 1px solid var(--border); }
  .meta-cell:last-child { border-right: none; }
  .meta-cell-label { font-size: 10px; color: var(--text-muted); letter-spacing: .04em; text-transform: uppercase; margin-bottom: 5px; }
  .meta-cell-val { font-size: 13px; color: var(--text-secondary); font-weight: 500; }
  .vol-bar { display: flex; gap: 3px; margin-top: 5px; }
  .vol-dot { width: 22px; height: 4px; border-radius: 3px; }
  .vol-dot.on { background: var(--accent); }
  .vol-dot.off { background: var(--border); }
  .vol-page { font-size: 11px; color: var(--text-muted); margin-top: 3px; }

  .text-section { margin-bottom: 10px; }
  .text-section-label { font-size: 10px; color: var(--text-muted); letter-spacing: .04em; text-transform: uppercase; margin-bottom: 5px; }
  .text-section-body { font-size: 13px; color: var(--text-secondary); line-height: 1.75; background: var(--surface2); border-radius: var(--radius); padding: 10px 13px; }
  .divider-h { height: 1px; background: var(--border); margin: 12px 0; }

  .card-actions { display: flex; gap: 6px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
  .btn-sm { font-size: 12px; padding: 5px 12px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: none; cursor: pointer; color: var(--text-muted); font-family: inherit; }
  .btn-sm:hover { background: var(--surface2); color: var(--text-primary); }
  .btn-del:hover { background: var(--danger-light); color: var(--danger); border-color: var(--danger-border); }

  .add-btn { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 16px; padding: 13px 18px; border: 1.5px dashed var(--border-strong); border-radius: var(--radius-lg); background: none; cursor: pointer; width: 100%; color: var(--text-muted); font-size: 13px; font-family: inherit; transition: all .12s; }
  .add-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 14px; }
  .manager-banner { background: var(--warn-light); border: 1px solid var(--warn-border); border-radius: var(--radius); padding: 9px 14px; font-size: 12px; color: var(--warn); margin-bottom: 18px; }

  .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 100; align-items: center; justify-content: center; }
  .modal-backdrop.open { display: flex; }
  .modal { background: var(--surface); border-radius: var(--radius-lg); padding: 28px; width: 520px; max-width: 95vw; max-height: 92vh; overflow-y: auto; }
  .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 20px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; font-weight: 600; }
  .field input, .field textarea, .field select { width: 100%; padding: 8px 11px; border: 1px solid var(--border-strong); border-radius: var(--radius); font-size: 13px; font-family: inherit; background: var(--surface); color: var(--text-primary); }
  .field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--accent); }
  .field textarea { resize: vertical; min-height: 72px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field-hint { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
  .modal-section-title { font-size: 11px; color: var(--text-muted); letter-spacing: .06em; text-transform: uppercase; margin: 20px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; }
  .btn-primary { padding: 8px 20px; border-radius: var(--radius); background: var(--accent); color: #fff; border: none; font-size: 13px; font-family: inherit; cursor: pointer; font-weight: 600; }
  .btn-secondary { padding: 8px 14px; border-radius: var(--radius); background: none; border: 1px solid var(--border-strong); font-size: 13px; font-family: inherit; cursor: pointer; color: var(--text-secondary); }
</style>
</head>
<body>
<div class="layout">
  <nav class="sidebar">
    <div class="sidebar-logo">📚 교재 큐레이션</div>
    <div class="nav-section">
      <span class="nav-label">학년</span>
      <button class="grade-btn" onclick="setGrade('중1')">중1</button>
      <button class="grade-btn" onclick="setGrade('중2')">중2</button>
      <button class="grade-btn" onclick="setGrade('중3')">중3</button>
      <button class="grade-btn active" onclick="setGrade('고1')">고1</button>
      <button class="grade-btn" onclick="setGrade('고2')">고2</button>
      <button class="grade-btn" onclick="setGrade('고3')">고3</button>
    </div>
  </nav>

  <main class="main">
    <div class="filter-bar">
      <div class="filter-group">
        <span class="filter-label">역량</span>
        <button class="chip" id="chip-high" onclick="setLevel('high')">상</button>
        <button class="chip sel-mid" id="chip-mid" onclick="setLevel('mid')">중</button>
        <button class="chip" id="chip-low" onclick="setLevel('low')">하</button>
      </div>
      <div class="divider-v"></div>
      <div class="filter-group">
        <span class="filter-label">시기</span>
        <button class="chip sel-season" id="chip-summer" onclick="toggleSeason('summer')">여름방학</button>
        <button class="chip" id="chip-always" onclick="toggleSeason('always')">상시</button>
        <button class="chip" id="chip-winter" onclick="toggleSeason('winter')">겨울방학</button>
      </div>
    </div>

    <div class="subj-area" id="subjectArea"></div>
    <div class="manager-banner">✏️ <strong>매니저 전용</strong> — 카드 하단 편집 버튼으로 내용을 수정하거나, 아래 버튼으로 교재를 직접 추가할 수 있어요.</div>

    <div class="result-header">
      <div class="result-title" id="resultTitle">고1 · <span>국어 문학</span> · 중</div>
      <div class="result-count" id="resultCount">교재 0권</div>
    </div>
    <div class="book-list" id="bookList"></div>
    <button class="add-btn" onclick="openAdd()">+ 교재 직접 추가</button>
  </main>
</div>

<div class="modal-backdrop" id="modal">
  <div class="modal">
    <div class="modal-title" id="modalTitle">교재 추가</div>
    <div class="modal-section-title">기본 정보</div>
    <div class="field-row">
      <div class="field"><label>교재명 *</label><input id="f-title" placeholder="예) 매3문 2027"></div>
      <div class="field"><label>출판사 / 저자</label><input id="f-pub" placeholder="예) 키출판사 / 안인숙"></div>
    </div>
    <div class="modal-section-title">분량</div>
    <div class="field-row">
      <div class="field">
        <label>분량 (대략)</label>
        <select id="f-vol">
          <option value="1">적음 — 방학 2~3주 완성</option>
          <option value="2" selected>중간 — 방학 4~5주 완성</option>
          <option value="3">많음 — 방학 전체 + α</option>
        </select>
      </div>
      <div class="field">
        <label>페이지 수 (선택)</label>
        <input id="f-pages" type="number" placeholder="예) 268" min="1">
        <div class="field-hint">알라딘 기본정보 &gt; 쪽수 확인</div>
      </div>
    </div>
    <div class="modal-section-title">시기 추천</div>
    <div class="field">
      <label>시기 추천</label>
      <select id="f-season">
        <option value="summer">여름방학 추천</option>
        <option value="always">상시 (학기중·방학 모두)</option>
        <option value="winter">겨울방학 추천</option>
      </select>
    </div>
    <div class="modal-section-title">해설지</div>
    <div class="field">
      <label>해설지 수준</label>
      <select id="f-sol">
        <option value="3">★★★ 매우 상세 — 혼자 이해 가능</option>
        <option value="2">★★☆ 보통 — 대부분 이해 가능</option>
        <option value="1">★☆☆ 간략 — 교사 도움 필요</option>
      </select>
    </div>
    <div class="modal-section-title">내용</div>
    <div class="field"><label>교재 특징</label><textarea id="f-feature" placeholder="구성, 수록 작품 수, 기출 범위, 난이도 등 교재 자체의 특징을 적어주세요."></textarea></div>
    <div class="field"><label>매니지먼트 방식</label><textarea id="f-mgmt" placeholder="어떤 학생에게 배정하는지, 학습 페이스, 병행 교재 등을 적어주세요."></textarea></div>
    <div class="modal-section-title">분류</div>
    <div class="field-row">
      <div class="field">
        <label>역량 추천</label>
        <select id="f-level">
          <option value="high">상</option>
          <option value="mid" selected>중</option>
          <option value="low">하</option>
          <option value="all">상/중/하 공통</option>
        </select>
      </div>
      <div class="field">
        <label>트랙</label>
        <select id="f-track">
          <option value="학년 과정">학년 과정</option>
          <option value="계통별 복습">계통별 복습</option>
          <option value="선택과목">선택과목</option>
        </select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">취소</button>
      <button class="btn-primary" onclick="saveBook()">저장</button>
    </div>
  </div>
</div>

<script>
const SUBJECTS = {
  '중1':{ '국어':['문학','비문학(독서)','문법·어휘','모의고사','종합'], '영어':['어휘','문법','구문독해','유형독해','모의고사','종합'], '수학':{'학년 과정':['중1 전범위'],'계통별':['수와 연산','문자와 식','함수','도형','통계·확률']}, '과학':{'학년 과정':['중1 전범위'],'계통별':['물질','생명','운동과 에너지','지구와 우주']}, '역사·사회':['역사 (전근대)','사회'] },
  '중2':{ '국어':['문학','비문학(독서)','문법·어휘','모의고사','종합'], '영어':['어휘','문법','구문독해','유형독해','모의고사','종합'], '수학':{'학년 과정':['중2 전범위'],'계통별':['수와 연산','문자와 식','함수','도형','통계·확률']}, '과학':{'학년 과정':['중2 전범위'],'계통별':['물질','생명','운동과 에너지','지구와 우주']}, '역사·사회':['역사 (근현대)','사회'] },
  '중3':{ '국어':['문학','비문학(독서)','문법·어휘','모의고사','종합'], '영어':['어휘','문법','구문독해','유형독해','모의고사','종합'], '수학':{'학년 과정':['중3 전범위'],'계통별':['수와 연산','문자와 식','함수','도형','통계·확률']}, '과학':{'학년 과정':['중3 전범위'],'계통별':['물질','생명','운동과 에너지','지구와 우주']}, '역사·사회':['역사','사회'] },

      });
    } else {
      Object.entries(subs).forEach(([cat, items]) => {
        items.forEach(s => {
          const tag = (cat==='학년 과정'||cat==='모의고사') ? '' : `<span style="font-size:10px;opacity:.55;margin-left:2px">(${cat})</span>`;
          html += `<button class="subj-tab${ST.mainSubj===main&&ST.subSubj===s?' active':''}" onclick="setSubj('${esc(main)}','${esc(s)}')">${s}${tag}</button>`;
        });
      });
    }
    html += `</div></div>`;
  });
  document.getElementById('subjectArea').innerHTML = html;
}

function esc(s) { return s.replace(/'/g,"\\'"); }

function volLabel(v) { return v===1?'적음':v===2?'중간':'많음'; }
function volDots(v) { return [1,2,3].map(i=>`<div class="vol-dot ${i<=v?'on':'off'}"></div>`).join(''); }
function solLabel(s) { return s===3?'★★★ 매우 상세':s===2?'★★☆ 보통':'★☆☆ 간략'; }
function seasonLabel(s) { return s==='summer'?'여름방학 추천':s==='winter'?'겨울방학 추천':'상시'; }
function seasonCls(s) { return s==='summer'?'badge-summer':s==='winter'?'badge-winter':'badge-always'; }
function levelLabel(l) { return l==='high'?'상':l==='mid'?'중':l==='low'?'하':'상/중/하 공통'; }
function levelCls(l) { return l==='high'?'badge-level-high':l==='mid'?'badge-level-mid':l==='low'?'badge-level-low':'badge-level-all'; }

function renderBooks() {
  const lMap = {high:'상', mid:'중', low:'하'};
  document.getElementById('resultTitle').innerHTML = `${ST.grade} · <span>${ST.mainSubj} ${ST.subSubj}</span> · ${lMap[ST.level]}`;
  const books = getBooks();
  document.getElementById('resultCount').textContent = `교재 ${books.length}권`;
  if (!books.length) {
    document.getElementById('bookList').innerHTML = `<div class="empty-state">📭<br><br>아직 등록된 교재가 없어요.<br><span style="font-size:12px">아래 버튼으로 직접 추가해주세요.</span></div>`;
    return;
  }
  document.getElementById('bookList').innerHTML = books.map(b => `
    <div class="book-card">
      <div class="card-header">
        <div>
          <div class="card-name">${b.title}</div>
          <div class="card-pub">${b.publisher}</div>
        </div>
        <div class="card-header-right">
          <span class="badge ${seasonCls(b.season)}">${seasonLabel(b.season)}</span>
          <span class="badge ${levelCls(b.level)}">${levelLabel(b.level)}</span>
        </div>
      </div>
      <div class="meta-row">
        <div class="meta-cell">
          <div class="meta-cell-label">분량</div>
          <div class="meta-cell-val">${volLabel(b.volume)}</div>
          <div class="vol-bar">${volDots(b.volume)}</div>
          ${b.pages ? `<div class="vol-page">약 ${b.pages}쪽</div>` : '<div class="vol-page" style="color:var(--border-strong)">쪽수 미입력</div>'}
        </div>
        <div class="meta-cell">
          <div class="meta-cell-label">해설지</div>
          <div class="meta-cell-val" style="font-size:12px">${solLabel(b.solStars)}</div>
        </div>
        <div class="meta-cell">
          <div class="meta-cell-label">역량 추천</div>
          <div class="meta-cell-val">${levelLabel(b.level)}</div>
        </div>
      </div>
      <div class="text-section">
        <div class="text-section-label">교재 특징</div>
        <div class="text-section-body">${b.feature||'—'}</div>
      </div>
      <div class="divider-h"></div>
      <div class="text-section">
        <div class="text-section-label">매니지먼트 방식</div>
        <div class="text-section-body">${b.mgmt||'—'}</div>
      </div>
      <div class="card-actions">
        <button class="btn-sm" onclick="openEdit(${b.id})">✏️ 편집</button>
        <button class="btn-sm btn-del" onclick="deleteBook(${b.id})">🗑 삭제</button>
      </div>
    </div>
  `).join('');
}

function render() { renderSubjects(); renderBooks(); }

function setGrade(g) {
  ST.grade = g;
  const map = SUBJECTS[g]||{};
  const first = Object.keys(map)[0];
  const subs = map[first];
  ST.mainSubj = first;
  ST.subSubj = Array.isArray(subs) ? subs[0] : Object.values(subs)[0][0];
  document.querySelectorAll('.grade-btn').forEach(b => b.classList.toggle('active', b.textContent===g));
  render();
}
function setLevel(l) {
  ST.level = l;
  ['high','mid','low'].forEach(x => { document.getElementById('chip-'+x).className = 'chip'+(x===l?` sel-${x}`:''); });
  renderBooks();
}
function toggleSeason(s) {
  const i = ST.seasons.indexOf(s);
  if(i>=0) ST.seasons.splice(i,1); else ST.seasons.push(s);
  document.getElementById('chip-'+s).className = 'chip'+(ST.seasons.includes(s)?' sel-season':'');
}
function setSubj(main,sub) { ST.mainSubj=main; ST.subSubj=sub; render(); }

function openAdd() {
  ST.editingId=null;
  document.getElementById('modalTitle').textContent='교재 추가';
  ['title','pub','pages','feature','mgmt'].forEach(f=>document.getElementById('f-'+f).value='');
  document.getElementById('f-vol').value='2';
  document.getElementById('f-season').value='summer';
  document.getElementById('f-sol').value='2';
  document.getElementById('f-level').value=ST.level;
  document.getElementById('f-track').value='학년 과정';
  document.getElementById('modal').classList.add('open');
}
function openEdit(id) {
  const b = getBooks().find(x=>x.id===id); if(!b) return;
  ST.editingId=id;
  document.getElementById('modalTitle').textContent='교재 편집';
  document.getElementById('f-title').value=b.title;
  document.getElementById('f-pub').value=b.publisher;
  document.getElementById('f-pages').value=b.pages||'';
  document.getElementById('f-vol').value=b.volume;
  document.getElementById('f-season').value=b.season;
  document.getElementById('f-sol').value=b.solStars;
  document.getElementById('f-feature').value=b.feature||'';
  document.getElementById('f-mgmt').value=b.mgmt||'';
  document.getElementById('f-level').value=b.level;
  document.getElementById('f-track').value=b.track||'학년 과정';
  document.getElementById('modal').classList.add('open');
}
function closeModal() { document.getElementById('modal').classList.remove('open'); }
function saveBook() {
  const title=document.getElementById('f-title').value.trim();
  if(!title){alert('교재명을 입력해주세요.');return;}
  const k=getKey(); if(!BOOKS_DB[k]) BOOKS_DB[k]=[];
  const data={ title, publisher:document.getElementById('f-pub').value||'-', volume:parseInt(document.getElementById('f-vol').value), pages:parseInt(document.getElementById('f-pages').value)||null, season:document.getElementById('f-season').value, solStars:parseInt(document.getElementById('f-sol').value), feature:document.getElementById('f-feature').value||'', mgmt:document.getElementById('f-mgmt').value||'', level:document.getElementById('f-level').value, track:document.getElementById('f-track').value };
  if(ST.editingId!==null){ const idx=BOOKS_DB[k].findIndex(x=>x.id===ST.editingId); if(idx>=0) BOOKS_DB[k][idx]={id:ST.editingId,...data}; }
  else { BOOKS_DB[k].push({id:Date.now(),...data}); }
  closeModal(); renderBooks();
}
function deleteBook(id) {
  if(!confirm('이 교재를 삭제할까요?')) return;
  const k=getKey(); BOOKS_DB[k]=(BOOKS_DB[k]||[]).filter(x=>x.id!==id); renderBooks();
}
document.getElementById('modal').addEventListener('click',e=>{ if(e.target===document.getElementById('modal')) closeModal(); });
render();
</script>
</body>
</html>
