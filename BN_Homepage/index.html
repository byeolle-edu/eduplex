<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>별내점 홈페이지 | 로그인</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="assets/logo-icon.png" alt="Sangsangplex">
      <span>별내점 홈페이지</span>
    </div>
    <p class="auth-sub">별내점 일정·일지·자료를 한 곳에서 관리합니다</p>

    <div class="tabs">
      <button class="tab-btn active" id="tabLogin">로그인</button>
      <button class="tab-btn" id="tabSignup">회원가입</button>
    </div>

    <!-- 로그인 폼 -->
    <form id="loginForm">
      <div class="field">
        <label>이메일</label>
        <input type="email" id="loginEmail" required>
      </div>
      <div class="field">
        <label>비밀번호</label>
        <input type="password" id="loginPassword" required>
      </div>
      <button class="btn" type="submit">로그인</button>
      <p class="error-msg" id="loginError"></p>
      <p style="text-align:center;margin-top:10px;">
        <a href="#" id="forgotPwLink" style="font-size:12.5px;">비밀번호 변경하기</a>
      </p>
    </form>

    <!-- 비밀번호 변경 폼 -->
    <form id="pwChangeForm" style="display:none;">
      <p style="font-size:12.5px;color:var(--text-muted);margin:0 0 14px;">현재 이메일과 비밀번호를 입력하면 바로 새 비밀번호로 바꿀 수 있어요.</p>
      <div class="field">
        <label>이메일</label>
        <input type="email" id="pwChangeEmail" required>
      </div>
      <div class="field">
        <label>현재 비밀번호</label>
        <input type="password" id="pwChangeCurrent" required>
      </div>
      <div class="field">
        <label>새 비밀번호 (6자 이상)</label>
        <input type="password" id="pwChangeNew" required minlength="6">
      </div>
      <button class="btn" type="submit">비밀번호 변경</button>
      <p class="error-msg" id="pwChangeError"></p>
      <p style="text-align:center;margin-top:10px;">
        <a href="#" id="backToLoginLink" style="font-size:12.5px;">로그인으로 돌아가기</a>
      </p>
    </form>

    <!-- 회원가입 폼 -->
    <form id="signupForm" style="display:none;">
      <div class="field">
        <label>이름</label>
        <input type="text" id="suName" required>
      </div>
      <div class="field">
        <label>이메일</label>
        <input type="email" id="suEmail" required>
      </div>
      <div class="field">
        <label>비밀번호 (6자 이상)</label>
        <input type="password" id="suPassword" required minlength="6">
      </div>
      <button class="btn" type="submit">회원가입</button>
      <p class="error-msg" id="signupError"></p>
    </form>

    <p class="hint">문제가 있나요? 원장에게 계정 확인을 요청하세요.</p>
  </div>
</div>

<script type="module" src="js/auth.js"></script>
</body>
</html>
