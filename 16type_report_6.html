<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<title>에듀플렉스 · VLT 4G 학습유형 보고서</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: 'Malgun Gothic', '맑은 고딕', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
  background: #f5f6f8;
  color: #1a1d23;
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ══════════════════════════════
   LAYOUT
══════════════════════════════ */
.shell { display: flex; min-height: 100vh; }

/* ── SIDEBAR ── */
.sidebar {
  width: 240px; min-height: 100vh;
  background: #1e2d5a;
  border-right: 1px solid #2a3f7a;
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  flex-shrink: 0;
}
.sidebar::-webkit-scrollbar { width: 3px; }
.sidebar::-webkit-scrollbar-thumb { background: #2a3f7a; border-radius: 2px; }

.sidebar-logo {
  padding: 22px 18px 16px;
  border-bottom: 1px solid #2a3f7a;
}
.brand { display: flex; align-items: center; gap: 9px; margin-bottom: 5px; }
.brand-mark {
  width: 28px; height: 28px; border-radius: 7px;
  background: #F5C518;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.brand-mark svg { width: 13px; height: 13px; fill: #1e2d5a; }
.brand-name { font-size: 14px; font-weight: 700; color: #fff; }
.brand-sub { font-size: 11px; color: #7a9cc8; padding-left: 37px; }

.sidebar-sec-title {
  font-size: 10px; font-weight: 700; color: #7a9cc8;
  letter-spacing: 0.08em; padding: 14px 18px 6px; display: block;
}
.type-list { padding: 0 10px 12px; }
.type-btn {
  width: 100%; display: flex; align-items: center; gap: 9px;
  padding: 8px 10px; border: none; background: none; cursor: pointer;
  border-radius: 8px; text-align: left; margin-bottom: 2px;
  border: 1px solid transparent;
  transition: all 0.14s; font-family: inherit;
}
.type-btn:hover { background: #243472; }
.type-btn.active { background: #2a3f7a; border-color: #F5C518; }
.btn-num {
  width: 28px; height: 28px; border-radius: 7px;
  background: #243472;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: #7a9cc8;
  flex-shrink: 0; transition: all 0.14s;
}
.type-btn.active .btn-num { background: #F5C518; color: #1e2d5a; }
.type-btn.has-data:hover .btn-num { background: #e6b800; color: #1e2d5a; }
.btn-info { flex: 1; min-width: 0; }
.btn-name { font-size: 13px; font-weight: 500; color: #b0c8e8; line-height: 1.3; }
.btn-tag { font-size: 11px; color: #5a7aaa; margin-top: 1px; }
.type-btn.active .btn-name { color: #F5C518; font-weight: 700; }
.type-btn.active .btn-tag { color: #c8a200; }
.data-dot { width: 6px; height: 6px; border-radius: 50%; background: #F5C518; flex-shrink: 0; }
.no-dot { width: 6px; }

.sidebar-foot { margin-top: auto; padding: 14px 16px; border-top: 1px solid #2a3f7a; }
.live-badge {
  display: flex; align-items: center; gap: 7px;
  background: #243472; border: 1px solid #3a54a0; border-radius: 20px; padding: 7px 12px;
}
.live-dot { width: 6px; height: 6px; border-radius: 50%; background: #F5C518; animation: blink 2s infinite; }
@keyframes blink { 0%,100%{opacity:1;} 50%{opacity:.3;} }
.live-txt { font-size: 11px; color: #F5C518; font-weight: 600; }

/* ── MAIN ── */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: #f5f6f8; }

/* ── TOPBAR ── */
.topbar {
  background: #1e2d5a; border-bottom: 1px solid #2a3f7a;
  padding: 14px 28px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; flex-wrap: wrap;
  position: sticky; top: 0; z-index: 10;
}
.topbar-eyebrow { font-size: 11px; color: #7a9cc8; }
.topbar-title { font-size: 17px; font-weight: 700; color: #fff; margin-top: 2px; }
.top-actions { display: flex; gap: 8px; }
.btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 7px 14px; border-radius: 8px;
  font-size: 12px; font-weight: 700; cursor: pointer;
  font-family: inherit; transition: all 0.14s; white-space: nowrap;
}
.btn-line { background: #243472; color: #b0c8e8; border: 1px solid #3a54a0; }
.btn-line:hover { background: #2a3f7a; }
.btn-print { background: #F5C518; color: #1e2d5a; border: 1px solid #F5C518; }
.btn-print:hover { background: #e6b800; }

/* ── CONTENT ── */
.content { padding: 28px 28px 48px; flex: 1; }

/* ── EMPTY ── */
.empty {
  text-align: center; padding: 80px 20px;
  display: flex; flex-direction: column; align-items: center;
}
.empty-icon-wrap {
  width: 54px; height: 54px; border-radius: 14px;
  background: #fff; border: 1px solid #e0e4ef;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 16px;
}
.empty-icon-wrap svg { width: 22px; height: 22px; stroke: #b0b8d0; fill: none; stroke-width: 1.5; }
.empty-t { font-size: 15px; font-weight: 700; color: #4a5a7a; margin-bottom: 6px; }
.empty-s { font-size: 13px; color: #8a9ab8; line-height: 1.7; }

/* ── REPORT ── */
.report { animation: fadeUp .22s ease; }
@keyframes fadeUp { from{opacity:0;transform:translateY(5px);} to{opacity:1;transform:none;} }

/* hero */
.report-hero {
  border-radius: 12px 12px 0 0;
  padding: 28px 28px 22px;
  display: flex; align-items: flex-start; justify-content: space-between;
  position: relative; overflow: hidden;
}
.hero-content { position: relative; z-index: 1; }
.hero-label { font-size: 11px; letter-spacing: 0.1em; color: rgba(255,255,255,0.65); margin-bottom: 8px; font-weight: 500; }
.hero-name { font-size: 30px; font-weight: 700; color: #fff; line-height: 1.2; margin-bottom: 6px; }
.hero-sub { font-size: 13px; color: rgba(255,255,255,0.85); line-height: 1.6; }
.hero-bignum {
  font-size: 72px; font-weight: 700; color: rgba(255,255,255,0.12);
  line-height: 1; flex-shrink: 0; position: relative; z-index: 1;
  font-feature-settings: 'tnum'; letter-spacing: -2px;
}

/* tag bar */
.tag-bar {
  padding: 10px 28px; display: flex; flex-wrap: wrap; gap: 6px;
}
.htag {
  font-size: 12px; font-weight: 700; padding: 5px 14px; border-radius: 20px;
  background: #F5C518; color: #1e2d5a;
  border: none;
}

/* report body */
.report-body {
  background: #fff; border: 1px solid #dde2ef; border-top: none;
  border-radius: 0 0 12px 12px;
  padding: 28px 28px;
  display: flex; flex-direction: column; gap: 24px;
}

/* ── PART LABEL (대목차: A/B) ── */
.part-label-wrap { margin-bottom: 4px; }
.part-label {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 17px; font-weight: 700; letter-spacing: 0.02em;
  color: #1a2d6e;
  padding: 8px 18px 8px 14px;
  background: #eef2fb;
  border-left: 4px solid #1a2d6e;
  border-radius: 0 8px 8px 0;
}

/* ── SEC TITLE (소목차) ── */
.sec-title {
  font-size: 14px; font-weight: 700; letter-spacing: 0.03em;
  color: #1a2d6e;
  padding-bottom: 10px;
  border-bottom: 2px solid #1a2d6e;
  margin-bottom: 14px;
}

/* card */
.card {
  background: #f8f9fc; border: 1px solid #e2e6f0;
  border-radius: 10px; padding: 16px 18px; margin-bottom: 10px;
}
.card:last-child { margin-bottom: 0; }
.card-label {
  font-size: 13px; font-weight: 700;
  display: flex; align-items: center; gap: 7px;
  margin-bottom: 14px; color: #1a1d23;
}
.cdot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

/* ilist (key-value) */
.ilist { display: flex; flex-direction: column; }
.irow {
  display: flex; gap: 16px; align-items: flex-start;
  padding: 11px 0; border-bottom: 1px solid #e8ecf5;
}
.irow:first-child { padding-top: 0; }
.irow:last-child { border-bottom: none; padding-bottom: 0; }
.ikey {
  font-size: 12px; font-weight: 700; min-width: 120px;
  color: #1a1d23; flex-shrink: 0; line-height: 1.5; padding-top: 2px;
  background: #e8ecf5; border-radius: 5px; padding: 3px 10px;
  height: fit-content; white-space: nowrap;
}
.ival { font-size: 13px; color: #1a1d23; line-height: 1.8; }

/* nlist (numbered) */
.nlist { display: flex; flex-direction: column; gap: 12px; }
.nrow { display: flex; gap: 12px; align-items: flex-start; }
.ncirc {
  width: 24px; height: 24px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; flex-shrink: 0; margin-top: 1px;
}
.ntxt { font-size: 13px; color: #1a1d23; line-height: 1.8; }
.ntxt strong { font-weight: 700; color: #1a1d23; }

/* wlist (numbered rows) */
.wlist { display: flex; flex-direction: column; }
.wrow { padding: 12px 0; border-bottom: 1px solid rgba(0,0,0,0.1); }
.wrow:first-child { padding-top: 0; }
.wrow:last-child { border-bottom: none; padding-bottom: 0; }
.wtrig {
  font-size: 13px; font-weight: 700; color: #1a1d23;
  display: flex; align-items: flex-start; gap: 8px;
  margin-bottom: 6px; line-height: 1.5;
}
.wtrig-num {
  width: 22px; height: 22px; border-radius: 50%;
  background: #1e2d5a; color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; flex-shrink: 0; margin-top: 1px;
}
.warrow { font-size: 13px; color: #8a9aaa; padding-left: 2px; margin-bottom: 4px; }
.wact { font-size: 13px; color: #1a1d23; line-height: 1.8; padding-left: 4px; }
.wext {
  font-size: 12px; color: #2a2000; line-height: 1.75;
  padding: 9px 12px; margin-top: 8px;
  background: rgba(0,0,0,0.07); border-radius: 7px;
  border-left: 3px solid rgba(0,0,0,0.25);
}

/* yellow card (개별지도) */
.card-yellow {
  background: #FFF8DC; border: 1px solid #F0D060;
  border-radius: 10px; padding: 16px 18px; margin-bottom: 10px;
}
.card-yellow:last-child { margin-bottom: 0; }
.card-yellow .card-label { color: #1a1d23; }
.card-yellow .wtrig { color: #1a1d23; }
.card-yellow .wtrig-num { background: #d4a800; color: #fff; }
.card-yellow .wrow { border-bottom-color: #F0D060; }
.card-yellow .wact { color: #1a1d23; }
.card-yellow .warrow { color: #b0a060; }
.card-yellow .wext {
  background: rgba(240,208,96,0.25); border-left-color: #d4a800; color: #3a2e00;
}

/* footer */
.report-footer {
  border-top: 1px solid #e2e6f0; padding-top: 16px;
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 10px;
}
.ft-label { font-size: 12px; color: #8a9ab8; }

/* ══════════════════════════════
   MOBILE
══════════════════════════════ */
@media (max-width: 720px) {
  .sidebar { display: none; }
  .shell { flex-direction: column; }
  .main { min-height: 100vh; }
  .topbar { padding: 11px 14px; }
  .topbar-title { font-size: 14px; }
  .topbar-eyebrow { font-size: 10px; }
  .btn { padding: 7px 11px; font-size: 11px; }
  .content { padding: 12px 12px 40px; }
  .report-hero { padding: 20px 18px 16px; }
  .hero-name { font-size: 22px; }
  .hero-bignum { font-size: 52px; }
  .tag-bar { padding: 8px 14px; }
  .report-body { padding: 16px 14px; gap: 18px; }
  .card { padding: 13px 14px; }
  .ikey { min-width: 86px; font-size: 11px; }
  .ival { font-size: 12px; }
  .ntxt { font-size: 12px; }
  .wact { font-size: 12px; }

  .mobile-type-bar {
    display: block;
    background: #1e2d5a; border-bottom: 1px solid #2a3f7a;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    padding: 8px 12px; white-space: nowrap;
  }
  .mobile-type-bar::-webkit-scrollbar { display: none; }
  .m-type-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: 20px;
    border: 1px solid #3a54a0; font-size: 12px; font-weight: 700;
    cursor: pointer; background: #1e2d5a; color: #7a9cc8;
    font-family: inherit; margin-right: 5px;
    transition: all 0.14s;
  }
  .m-type-btn.active { background: #F5C518; color: #1e2d5a; border-color: #F5C518; }
  .m-type-btn.no-data { opacity: 0.4; }
}
@media (min-width: 721px) { .mobile-type-bar { display: none; } }

/* PRINT */
@media print {
  .sidebar, .topbar, .mobile-type-bar { display: none !important; }
  .main { background: #fff; }
  .content { padding: 0; max-width: 100%; }
  .report-hero, .tag-bar { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .card { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .report-footer .btn-print { display: none; }
  @page { margin: 1.5cm; }
}
</style>
</head>

  <aside class="sidebar">

  </main>
</div>

<script>
const TYPES = [
  {num:1,name:"(준비중)",tag:"데이터 입력 전",hasData:false},
  {num:2,name:"(준비중)",tag:"데이터 입력 전",hasData:false},
  {num:3,name:"(준비중)",tag:"데이터 입력 전",hasData:false},
  {num:4,name:"(준비중)",tag:"데이터 입력 전",hasData:false},
  {num:5,name:"(준비중)",tag:"데이터 입력 전",hasData:false},
  {num:6,name:"(준비중)",tag:"데이터 입력 전",hasData:false},
  {num:7,name:"(준비중)",tag:"데이터 입력 전",hasData:false},
  {
    num:8, name:"고집쟁이", tag:"자존심·고집 강함", hasData:true,
    color:"#1e2d5a", colorDark:"#152248",
    keyword:"자존심 강함 · 자기 고집 · 주변 시선 의식",
    tags:["자존심 강함","자기 고집","과도한 자기 긍정","주변 시선 의식","겉핥기 학습","감춰진 열등감","자기 합리화"],

    psych:[
      {k:"자존심 강함", v:"부족한 모습을 완전히 인정하지는 않으나 어느 정도 인정하는 경우도 있고, 마지못해 인정하는 모습을 보이는 경우도 있음."},
      {k:"자기 고집", v:"본인의 판단과 의견을 중요하게 생각하는 경향이 있음. 매니저의 의견 중 본인이 납득한 경우에 한해 수용하며, 고집이 매우 강한 경우 매니저의 제안을 수용하지 않는 사례도 있음."},
      {k:"과도한 자기 긍정", v:"본인의 현재 학습 수준이나 상황을 충분히 고려하지 않고, 수준에 맞지 않는 무리한 학습을 시도하는 경향이 있음."},
      {k:"주변 시선 의식", v:"주변 시선을 많이 인식하는 편이며, 매니저에게 평가받는 상황에 민감하게 반응하거나 보여주기식 공부로 이어지는 모습이 나타나기도 함."}
    ],
    behavior:[
      {k:"과도한 학습 계획", v:"초반에는 과도한 학습 계획을 세우려는 모습을 보이나, 실천하지 못하는 경험이 쌓이면서 점차 현실적인 계획으로 조정하려 하기도 함. 관심 있는 과목에 대해서는 과도하게 계획을 세우는 경향이 있음."},
      {k:"엉뚱한 공부", v:"본인의 현재 수준에 맞지 않는 학습을 시도하거나, 학습 방향 설정이 적절하지 않은 경우가 있음. 학원 의존도 및 학습 효율 측면에서도 점검이 필요함."},
      {k:"겉핥기 학습", v:"학습 시간을 일정 수준 확보하고 있으나, 깊이 있는 이해보다 전체를 빠르게 훑는 방식으로 학습하는 경우가 있음. 선호 과목에서도 겉핥기식 학습이 나타나며, 비선호 과목에서는 이러한 성향이 더욱 강하게 나타남."},
      {k:"부족한 실천 결과", v:"학습 시간 대비 결과가 기대에 미치지 못하는 경우가 있음. 선호 과목에 더 많은 시간을 투자하더라도 성적 향상으로 이어지지 않는 경우도 있음."},
      {k:"감춰진 열등감", v:"다른 사람들에게 뒤처지는 상황을 싫어하는 편이며, 초반의 과도한 계획 수립도 이 열등감에서 비롯되는 경향이 있음."},
      {k:"자기 합리화", v:"학습 결과가 기대에 미치지 못할 경우 상황이나 환경의 탓으로 돌리는 모습을 보임. 본인의 실력 부족을 인정하더라도 개선 의지로 이어지지 않는 경우가 있음."}
    ],

      {trig:"학습 계획이 과도하면 겁을 먹고 회피하거나 의욕이 급격히 낮아짐", act:"전체 계획 안내 시 가볍게 안내하고, 자료도 한 번에 주지 않고 그때그때 할 수 있는 분량만 제공. 주차별 계획을 여유롭게 설정.", ext:"강·약점 과목을 파악하고 약점 과목에 수업을 더 많이 배정. 주차를 잘 지켜서 성취했을 경우 크게 칭찬. 수업 횟수나 당일 수업 내용 변동 가능성을 항상 열어두고 수업 전 확인."},
      {trig:"반복 학습이 되지 않아 누수가 생겨도 늦게 알아차림", act:"지난 수업 학습 내용·숙제를 커리에 넣고 매 수업마다 반복 학습 진행. 학습 우선순위를 미리 정해두고 그 순서에 맞춰 진행.", ext:"지각·결석이 잦을 경우 중요한 부분을 놓치지 않도록 학습 우선순위를 명확히 설정해두기."}
    ]
  }
];

function pad(n){ return String(n).padStart(2,'0'); }

function iList(items){
  return '<div class="ilist">'+items.map(it=>
    `<div class="irow"><div class="ikey">${it.k}</div><div class="ival">${it.v}</div></div>`
  ).join('')+'</div>';
}
function nList(items, bg, clr){
  return '<div class="nlist">'+items.map((it,i)=>
    `<div class="nrow">
      <div class="ncirc" style="background:${bg};color:${clr};">${i+1}</div>
      <div class="ntxt"><strong>${it.t}</strong> — ${it.v}</div>
    </div>`
  ).join('')+'</div>';
}
function wList(items){
  return '<div class="wlist">'+items.map((it,i)=>
    `<div class="wrow">
      <div class="wtrig"><span class="wtrig-num">${i+1}</span>${it.trig}</div>
      <div class="warrow">↳</div>
      <div class="wact">${it.act}</div>
      ${it.ext?`<div class="wext">${it.ext}</div>`:''}
    </div>`
  ).join('')+'</div>';
}

let activeType = null;

function renderReport(t){
  document.getElementById('topEye').textContent = `TYPE ${pad(t.num)} · VLT 4G 학습유형 보고서`;
  document.getElementById('topTitle').textContent =
    t.hasData ? `${t.name} (TYPE ${pad(t.num)})` : `TYPE ${pad(t.num)} — 준비 중`;

  const content = document.getElementById('mainContent');
  if(!t.hasData){
    content.innerHTML = `<div class="empty">
      <div class="empty-icon-wrap">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><line x1="7" y1="9" x2="17" y2="9"/><line x1="7" y1="13" x2="13" y2="13"/></svg>
      </div>
      <div class="empty-t">TYPE ${t.num}번 — 준비 중</div>
      <div class="empty-s">아직 데이터가 입력되지 않은 타입입니다.<br>데이터를 채팅으로 보내주시면 바로 반영해드릴게요!</div>
    </div>`;
    return;
  }

  content.innerHTML = `
  <div class="report">
    <div class="report-hero" style="background:linear-gradient(135deg, ${t.color} 0%, ${t.colorDark} 100%);">
      <div class="hero-content">
        <div class="hero-label">TYPE ${pad(t.num)} · VLT 4G 학습유형</div>
        <div class="hero-name">${t.name}</div>
        <div class="hero-sub">${t.keyword}</div>
      </div>
      <div class="hero-bignum">${pad(t.num)}</div>
    </div>
    <div class="tag-bar" style="background:${t.colorDark};">
      ${t.tags.map(tg=>`<span class="htag">${tg}</span>`).join('')}
    </div>
    <div class="report-body">

      <div class="part-label-wrap">
        <span class="part-label">A. 상담 / 관리</span>
      </div>

      <div>
        <div class="sec-title">심리 · 정서 특성</div>
        <div class="card">${iList(t.psych)}</div>
      </div>

      <div>
        <div class="sec-title">학습 행동 · 역량 특성</div>
        <div class="card">${iList(t.behavior)}</div>
      </div>

      <div>
        <div class="sec-title">매니지먼트 방향</div>
        <div class="card">
          <div class="card-label">
            <div class="cdot" style="background:#1a2d6e;"></div>핵심 접근 전략
          </div>
          ${nList(t.mgmtDir,'#1a2d6e','#fff')}
        </div>
      </div>

      <div>
        <div class="sec-title">효과적인 상담 방법</div>
        <div class="card">
          <div class="card-label">
            <div class="cdot" style="background:#2a5aaa;"></div>상담 접근 방식
          </div>
          ${nList(t.counsel,'#2a5aaa','#fff')}
        </div>
      </div>

      <div class="part-label-wrap" style="margin-top:8px;">
        <span class="part-label">B. 개별지도</span>
      </div>

      <div>
        <div class="sec-title">개별지도 주의사항</div>
        <div class="card-yellow">
          <div class="card-label">
            <div class="cdot" style="background:#1e2d5a;"></div>① 수업 중 튜터 주의사항
          </div>
          ${wList(t.tutor)}
        </div>
        <div class="card-yellow">
          <div class="card-label">
            <div class="cdot" style="background:#1e2d5a;"></div>② 교실장 면담 유의점
          </div>
          ${wList(t.manager)}
        </div>
        <div class="card-yellow">
          <div class="card-label">
            <div class="cdot" style="background:#1e2d5a;"></div>③ 학습 커리큘럼 작성 유의점
          </div>
          ${wList(t.curri)}
        </div>
      </div>

      <div class="report-footer">
        <span class="ft-label">에듀플렉스 · VLT 4G 학습유형 보고서 · TYPE ${pad(t.num)}</span>
        <button class="btn btn-print" onclick="window.print()">🖨 PDF로 저장</button>
      </div>

    </div>
  </div>`;
}

function selectType(t, sideBtns, mobileBtns){
  sideBtns.forEach(b => b.classList.remove('active'));
  mobileBtns.forEach(b => b.classList.remove('active'));
  sideBtns[t.num-1].classList.add('active');
  mobileBtns[t.num-1].classList.add('active');
  activeType = t;
  renderReport(t);
  window.scrollTo({top:0, behavior:'smooth'});
}

function buildNav(){
  const sideList = document.getElementById('sideTypeList');
  const mobileBar = document.getElementById('mobileTypeBar');
  const sideBtns = [], mobileBtns = [];

  TYPES.forEach(t => {
    const sb = document.createElement('button');
    sb.className = 'type-btn' + (t.hasData ? ' has-data' : '');
    sb.innerHTML = `
      <div class="btn-num">${pad(t.num)}</div>
      <div class="btn-info">
        <div class="btn-name">${t.name}</div>
        <div class="btn-tag">${t.tag}</div>
      </div>
      ${t.hasData ? '<div class="data-dot"></div>' : '<div class="no-dot"></div>'}`;
    sb.addEventListener('click', () => selectType(t, sideBtns, mobileBtns));
    sideList.appendChild(sb);
    sideBtns.push(sb);

    const mb = document.createElement('button');
    mb.className = 'm-type-btn' + (!t.hasData ? ' no-data' : '');
    mb.textContent = t.hasData ? `${pad(t.num)} ${t.name}` : pad(t.num);
    mb.addEventListener('click', () => selectType(t, sideBtns, mobileBtns));
    mobileBar.appendChild(mb);
    mobileBtns.push(mb);
  });

  const t8 = TYPES.find(t => t.num === 8);
  if(t8) selectType(t8, sideBtns, mobileBtns);
}

buildNav();
</script>
</body>
</html>
